server:
  port: ${SERVER_PORT:8081}
  net: ${SERVER_NET:Mainnet}
  requester: ${REQUESTER:}
  ssl:
    enabled: ${SSL:false}
    key-store: ${KEYSTORE:src/main/resources/ca.pkcs12}
    key-store-password: ${KEYSTOREPW:changeit}
    keyStoreType: ${KEYSTORETYPE:PKCS12}
  permissioned: ${PERMISSIONED:false}
  permissionadmin: ${PERMISSIONADMIN:}
  myserverblockOnly: ${MYSERVERBLOCKONLY:false}
  runKafkaStream: ${RUNKAFKASTREAM:false}
  createtable: ${CREATETABLE:true}
  checkpoint: ${CHECKPOINT:-1}
  servermode: ${SERVERMODE:Fullnode}
  deniedIPlist: ${DENIEDIPLIST:}
  ipcheck: ${IPCHECK:false}
  allowIPlist: ${ALLOWIPLIST:}
  syncblocks: ${SYNCBLOCKS:1000}

db:
  hostname: ${DB_HOSTNAME:localhost}
  port: ${DB_PORT:5432}
  dbName: ${DB_NAME:layer0}
  username: ${DB_USERNAME:root}
  password: ${DB_PASSWORD:test1234}

store:
  domain: ${STORE_DOMAIN:core}

spring:
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:50}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: ${HIKARI_CONN_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

service:
  schedule:
    chainlength: ${SERVICE_CHAINLENGTH:false}
    syncrate: ${SERVICE_SYNC_RATE:50000}
    blockbatch: ${SERVICE_BLOCKBATCH:false}
    blockbatchrate: ${SERVICE_BLOCKBATCH_RATE:50000}
    initsync: ${SERVICE_INITSYNC:true}

kafka:
  bootstrapServers: ${BOOT_STRAP_SERVERS:}
  consumerIdSuffix: ${CONSUMERIDSUFFIX:bigtangletest}

pos:
  slotIntervalMs: ${POS_SLOT_INTERVAL_MS:12000}
  validatorKey: ${POS_VALIDATOR_KEY:}
  gossipPeers: ${POS_GOSSIP_PEERS:}

management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        # Restrict by default: loggers/threaddump/beans must not be writable/
        # readable on the API port. Extend selectively via env override.
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

