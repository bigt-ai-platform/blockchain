networks:
  bigtangle-bridged-network:
    driver: bridge

services:
  test-bigtangle-postgres:
    image: postgres:16
    container_name: test-bigtangle-postgres
    hostname: test-bigtangle-postgres
    networks:
      - bigtangle-bridged-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: info
    volumes:
      - /data/vm/test-bigtangle-postgres/var/lib/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d info"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  test-bigtangle:
    image: ghcr.io/bigt-ai-platform/layer0-server:latest
    container_name: test-bigtangle
    hostname: test-bigtangle
    networks:
      - bigtangle-bridged-network
    ports:
      - "18089:18089"
    environment:
      JAVA_OPTS: "-Xmx5028m --add-exports java.base/sun.nio.ch=ALL-UNNAMED -Dfile.encoding=UTF-8"
      DB_PASSWORD: test1234
      DB_PORT: 5432
      SERVER_PORT: 18089
      DB_NAME: info
      DB_HOSTNAME: test-bigtangle-postgres
      SERVER_REQUESTER: http://test-bigtangle:18089
      REQUESTER: http://test-bigtangle:18089
      SERVICE_CHAINLENGTH: "false"
      SERVER_RUN_KAFKA_STREAM: "false"
      SERVER_NET: Test
      SSL: "false"
    depends_on:
      - test-bigtangle-postgres
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    hostname: cloudflared
    networks:
      - bigtangle-bridged-network
    entrypoint: []
    command: ["cloudflared", "tunnel", "run"]
    restart: always
    volumes:
      # credentials.json holds the tunnel SECRET — it is gitignored and must
      # be generated per machine (see README-tunnel.md). The version committed
      # earlier leaked: rotate the tunnel before using this setup.
      - ./credentials.json:/etc/cloudflared/credentials.json:ro
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
