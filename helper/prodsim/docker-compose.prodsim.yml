      <<: *db-env

  l0-server-2:
    <<: *common-server
    container_name: prodsim-svr-2
    ports: ["8083:8083"]
    environment:
      <<: *server-base-env
      SERVER_PORT: 8083
      SERVER_MINERADDRESS: mj61qqqkFDcXFx6P5bMtspDH7tJZ7jVHL4
      DB_HOSTNAME: postgres-l0-2
      DB_NAME: layer0
      REQUESTER: http://prodsim-svr-0:8081
      CREATETABLE: "false"
    depends_on:
      postgres-l0-2: { condition: service_healthy }
