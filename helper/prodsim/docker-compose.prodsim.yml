      REQUESTER: http://prodsim-svr-1:8082
      DB_HOSTNAME: postgres-l0-1
      DB_NAME: layer0
      POS_VALIDATOR_KEY: "e2df872ffa069716425675cc2732e41a6bce2831c274ab9799fee43282252aac09f204dcb3e9066baf405995ee7c8701cc91facafdc22346523057981d8d3cd2"
    depends_on:
