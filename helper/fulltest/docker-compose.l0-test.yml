networks:
  l0-test-net:
    driver: bridge

services:

  postgres-l0-0:
    image: postgres:16
    container_name: l0-pg-0
    networks: [l0-test-net]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: layer0
    command: >
      postgres
      -c shared_buffers=1GB
      -c wal_buffers=16MB
      -c max_wal_size=4GB
      -c wal_compression=lz4
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c maintenance_work_mem=256MB
      -c effective_io_concurrency=4
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d layer0"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-l0-1:
    image: postgres:16
    container_name: l0-pg-1
    networks: [l0-test-net]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: layer0
    command: >
      postgres
      -c shared_buffers=1GB
      -c wal_buffers=16MB
      -c max_wal_size=4GB
      -c wal_compression=lz4
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c maintenance_work_mem=256MB
      -c effective_io_concurrency=4
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d layer0"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-l0-2:
    image: postgres:16
    container_name: l0-pg-2
    networks: [l0-test-net]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: layer0
    command: >
      postgres
      -c shared_buffers=1GB
      -c wal_buffers=16MB
      -c max_wal_size=4GB
      -c wal_compression=lz4
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
      -c maintenance_work_mem=256MB
      -c effective_io_concurrency=4
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d layer0"]
      interval: 5s
      timeout: 3s
      retries: 10

  l0-server-0:
    image: ghcr.io/bigt-ai-platform/layer0-server
    container_name: l0-svr-0
    networks: [l0-test-net]
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SERVER_NET: Test
      SERVER_MINERADDRESS: mjWvzPZz4YJtWqb7ux7cdgq5G7rzkg3bXG
      DB_HOSTNAME: postgres-l0-0
      DB_PORT: 5432
      DB_NAME: layer0
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      SERVICE_MINING: "false"
      SERVICE_MICROBATCH: "true"
      SERVICE_BLOCKBATCH: "true"
      SERVICE_SCHEDULE_UPCHAINRATE: 1000
      SERVICE_SYNC: "true"
      SERVICE_INITSYNC: "true"
      SYNCBLOCKS: 1000
      RUNKAFKASTREAM: "false"
      CREATETABLE: "true"
    depends_on:
      postgres-l0-0: { condition: service_healthy }

  l0-server-1:
    image: ghcr.io/bigt-ai-platform/layer0-server
    container_name: l0-svr-1
    networks: [l0-test-net]
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SERVER_NET: Test
      REQUESTER: http://l0-svr-0:8081
      SERVER_MINERADDRESS: mjWvzPZz4YJtWqb7ux7cdgq5G7rzkg3bXG
      DB_HOSTNAME: postgres-l0-1
      DB_PORT: 5432
      DB_NAME: layer0
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      SERVICE_MINING: "false"
      SERVICE_MICROBATCH: "true"
      SERVICE_BLOCKBATCH: "true"
      SERVICE_SCHEDULE_UPCHAINRATE: 1000
      SERVICE_SYNC: "true"
      SERVICE_INITSYNC: "true"
      SYNCBLOCKS: 1000
      RUNKAFKASTREAM: "false"
      CREATETABLE: "false"
    depends_on:
      postgres-l0-1: { condition: service_healthy }

  l0-server-2:
    image: ghcr.io/bigt-ai-platform/layer0-server
    container_name: l0-svr-2
    networks: [l0-test-net]
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SERVER_NET: Test
      REQUESTER: http://l0-svr-0:8081
      SERVER_MINERADDRESS: mjWvzPZz4YJtWqb7ux7cdgq5G7rzkg3bXG
      DB_HOSTNAME: postgres-l0-2
      DB_PORT: 5432
      DB_NAME: layer0
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      SERVICE_MINING: "false"
      SERVICE_MICROBATCH: "true"
      SERVICE_BLOCKBATCH: "true"
      SERVICE_SCHEDULE_UPCHAINRATE: 1000
      SERVICE_SYNC: "true"
      SERVICE_INITSYNC: "true"
      SYNCBLOCKS: 1000
      RUNKAFKASTREAM: "false"
      CREATETABLE: "false"
    depends_on:
      postgres-l0-2: { condition: service_healthy }



