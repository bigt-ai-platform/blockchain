networks:
  l0-test-net:
    driver: bridge

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: l0-kafka
    networks: [l0-test-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"

  postgres-l0-0:
    image: postgres:16
    container_name: l0-pg-0
    networks: [l0-test-net]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: layer0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d layer0"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-l0-1:
    image: postgres:16
    container_name: l0-pg-1
    networks: [l0-test-net]
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: layer0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d layer0"]
      interval: 5s
      timeout: 3s
      retries: 10

  l0-server-0:
    image: ghcr.io/bigt-ai-platform/test
    container_name: l0-svr-0
    networks: [l0-test-net]
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SERVER_NET: Test
      SERVER_MINERADDRESS: mjWvzPZz4YJtWqb7ux7cdgq5G7rzkg3bXG
      DB_HOSTNAME: postgres-l0-0
      DB_PORT: 5432
      DB_NAME: layer0
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      SERVICE_MINING: "false"
      SERVICE_SYNC: "true"
      SERVICE_INITSYNC: "true"
      CREATETABLE: "true"
      BOOT_STRAP_SERVERS: kafka:9092
      TOPIC_OUT_NAME: bigtangle
    depends_on:
      postgres-l0-0: { condition: service_healthy }

  l0-server-1:
    image: ghcr.io/bigt-ai-platform/test
    container_name: l0-svr-1
    networks: [l0-test-net]
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SERVER_NET: Test
      REQUESTER: http://l0-svr-0:8081
      SERVER_MINERADDRESS: mjWvzPZz4YJtWqb7ux7cdgq5G7rzkg3bXG
      DB_HOSTNAME: postgres-l0-1
      DB_PORT: 5432
      DB_NAME: layer0
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DBTYPE: postgresql
      SERVICE_MINING: "false"
      SERVICE_SYNC: "true"
      SERVICE_INITSYNC: "true"
      CREATETABLE: "false"
      BOOT_STRAP_SERVERS: kafka:9092
      TOPIC_OUT_NAME: bigtangle
    depends_on:
      postgres-l0-1: { condition: service_healthy }


