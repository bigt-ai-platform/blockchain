# Parallel MCMC test runner
# 16 test classes split across 4 independent groups.
# Each group has its own PostgreSQL instance; one shared Minio.
#
# Usage:
#   cd helper/docker-test-mcmc
#   docker compose build
#   docker compose up --exit-code-from test-group-4  (or use run-parallel-tests.sh)

x-postgres-common: &postgres-common
  image: postgres:16
  networks:
    - mcmc-test-net
  environment:
    POSTGRES_USER: root
    POSTGRES_PASSWORD: test1234
    POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U root"]
    interval: 5s
    timeout: 5s
    retries: 10

x-test-common: &test-common
  build:
    context: ../..
    dockerfile: helper/docker-test-mcmc/Dockerfile
  image: mcmc-test-runner:local
  networks:
    - mcmc-test-net
  environment:
    LANG: en_US.UTF-8
    DB_USERNAME: root
    DB_PASSWORD: test1234
    DB_PORT: 5432
    MINIO_URL: http://minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadminpassword
  volumes:
    - test-output:/test-output
  restart: "no"

networks:
  mcmc-test-net:
    driver: bridge

volumes:
  test-output:
  minio-data:

services:

  # ── Shared Minio ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: mcmc-test-minio
    networks:
      - mcmc-test-net
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL – one per group ─────────────────────────────────────────────
  postgres-1:
    <<: *postgres-common
    container_name: mcmc-test-postgres-1
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: testdb1

  postgres-2:
    <<: *postgres-common
    container_name: mcmc-test-postgres-2
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: testdb2

  postgres-3:
    <<: *postgres-common
    container_name: mcmc-test-postgres-3
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: testdb3

  postgres-4:
    <<: *postgres-common
    container_name: mcmc-test-postgres-4
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: testdb4

  # ── Test group 1 ──────────────────────────────────────────────────────────
  # ContractTest, DirectExchangeTest, FromAddressTests, GenesisBlockTipsTest
  test-group-1:
    <<: *test-common
    container_name: mcmc-test-group-1
    depends_on:
      postgres-1:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TEST_CLASSES: "ContractTest,DirectExchangeTest,FromAddressTests,GenesisBlockTipsTest"
      DB_HOSTNAME: postgres-1
      DB_NAME: testdb1
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DB_PORT: 5432
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword

  # ── Test group 2 ──────────────────────────────────────────────────────────
  # FullPrunedBlockGraphTest, MCMCServiceTest, OrderMatchTest, PaymentServiceTest
  test-group-2:
    <<: *test-common
    container_name: mcmc-test-group-2
    depends_on:
      postgres-2:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TEST_CLASSES: "FullPrunedBlockGraphTest,MCMCServiceTest,OrderMatchTest,PaymentServiceTest"
      DB_HOSTNAME: postgres-2
      DB_NAME: testdb2
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DB_PORT: 5432
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword

  # ── Test group 3 ──────────────────────────────────────────────────────────
  # RewardService2Test, RewardServiceTest, TipsServiceTest, RandomNumberBlock
  test-group-3:
    <<: *test-common
    container_name: mcmc-test-group-3
    depends_on:
      postgres-3:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TEST_CLASSES: "RewardService2Test,RewardServiceTest,TipsServiceTest,RandomNumberBlock"
      DB_HOSTNAME: postgres-3
      DB_NAME: testdb3
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DB_PORT: 5432
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword

  # ── Test group 4 ──────────────────────────────────────────────────────────
  # TokenTest, UserdataTest, ValidatorServiceTest, UtilsTest
  test-group-4:
    <<: *test-common
    container_name: mcmc-test-group-4
    depends_on:
      postgres-4:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TEST_CLASSES: "TokenTest,UserdataTest,ValidatorServiceTest,UtilsTest"
      DB_HOSTNAME: postgres-4
      DB_NAME: testdb4
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DB_PORT: 5432
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword

  # ── Single-container: all 16 tests against postgres-1 ──────────────────────
  #   docker compose up test-all
  #   or: ./run-parallel-tests.sh --single
  test-all:
    <<: *test-common
    container_name: mcmc-test-all
    depends_on:
      postgres-1:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TEST_CLASSES: "ContractTest,DirectExchangeTest,FromAddressTests,GenesisBlockTipsTest,FullPrunedBlockGraphTest,MCMCServiceTest,OrderMatchTest,PaymentServiceTest,RewardService2Test,RewardServiceTest,TipsServiceTest,RandomNumberBlock,TokenTest,UserdataTest,ValidatorServiceTest,UtilsTest"
      DB_HOSTNAME: postgres-1
      DB_NAME: testdb1
      DB_USERNAME: root
      DB_PASSWORD: test1234
      DB_PORT: 5432
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
