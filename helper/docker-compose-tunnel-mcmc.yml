  
 
networks:
  bigtangle-bridged-network:
    driver: bridge

services:
  test-bigtangle-postgres:
    image: postgres:16
    container_name: test-bigtangle-postgres
    hostname: test-bigtangle-postgres
    networks:
      - bigtangle-bridged-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: info
    volumes:
      - /data/vm/test-bigtangle-postgres/var/lib/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d info"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  minio:
    image: minio/minio
    container_name: minio
    hostname: minio
    networks:
      - bigtangle-bridged-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      MINIO_DEFAULT_BUCKETS: testbigtangle
    volumes:
      - /data/vm/minio/minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  test-bigtangle:
    build:
      context: ..
      dockerfile: helper/bigtangle/Dockerfile
    image: bigtangle-server:local
    container_name: test-bigtangle
    hostname: test-bigtangle
    networks:
      - bigtangle-bridged-network
    ports:
      - "18089:18089"
    links:
      - test-bigtangle-postgres
    environment:
      JAVA_OPTS: "-Ddebug -Xmx5028m --add-exports java.base/sun.nio.ch=ALL-UNNAMED -Dfile.encoding=UTF-8"
      DB_PASSWORD: test1234
      DB_USER: root
      DB_PORT: 5432
      SERVER_PORT: 18089
      DB_NAME: info
      DB_HOSTNAME: test-bigtangle-postgres
      MINIO_URL: http://minio:9000
      MINIO_ACCESSKEY: minioadmin
      MINIO_SECRETKEY: minioadminpassword
      MINIO_BUCKETNAME: testbigtangle
      SERVER_MINERADDRESS: 1LLtbSLJJn1D2churfWG55aDYqQQTu4eqH
      SERVERMODE: ""
      SERVER_REQUESTER: http://test-bigtangle:18089
      REQUESTER: http://test-bigtangle:18089

      SERVICE_MCMC: "false"
      SERVICE_SCHEDULE_MCMC: "true"
      SERVER_RUN_KAFKA_STREAM: "false"
      SERVER_NET: Test
      SSL: "false"
    depends_on:
      - test-bigtangle-postgres
      - minio

    restart: always

  test-bigtangle-mcmc:
    build:
      context: ..
      dockerfile: helper/bigtangle-mcmc/Dockerfile
    image: bigtangle-mcmc:local
    container_name: test-bigtangle-mcmc
    hostname: test-bigtangle-mcmc
    networks:
      - bigtangle-bridged-network
    ports:
      - "18090:8088"
    environment:
      JAVA_OPTS: "-Ddebug -Xmx2048m --add-exports java.base/sun.nio.ch=ALL-UNNAMED -Dfile.encoding=UTF-8"
      DB_PASSWORD: test1234
      DB_USER: root
      DB_PORT: 5432
      SERVER_PORT: 8088
      DB_NAME: info
      DB_HOSTNAME: test-bigtangle-postgres
      MINIO_URL: http://minio:9000
      MINIO_ACCESSKEY: minioadmin
      MINIO_SECRETKEY: minioadminpassword
      MINIO_BUCKETNAME: testbigtangle
      SERVER_MINERADDRESS: 1LLtbSLJJn1D2churfWG55aDYqQQTu4eqH
      SERVER_NET: Test
      SSL: "false"
      SERVICE_MCMC: "true"
      SERVICE_MCMC_RATE: 1000
      SERVICE_SCHEDULE_MCMC: "true"
      SERVER_SERVERURL: "http://test-bigtangle:18089"
      SERVICE_MINING_RATE: 36000
      SERVICE_MINING: "true"
      SERVER_RUN_KAFKA_STREAM: "false"
    depends_on:
      - test-bigtangle-postgres
      - minio
      - test-bigtangle
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    hostname: cloudflared
    networks:
      - bigtangle-bridged-network
    entrypoint: []
    command: ["cloudflared", "tunnel", "run"]
    restart: always
    volumes:
      - /home/jcui/git/server/helper/cloudflared-config-mcmc.yml:/etc/cloudflared/config.yml:ro
      - /home/jcui/git/server/helper/credentials.json:/etc/cloudflared/credentials.json
