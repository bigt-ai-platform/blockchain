version: '3.8'

networks:
  bigtangle-bridged-network:
    driver: bridge

services:
  test-bigtangle-postgres:
    image: postgres:16
    container_name: test-bigtangle-postgres
    hostname: test-bigtangle-postgres
    networks:
      - bigtangle-bridged-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test1234
      POSTGRES_DB: info
    volumes:
      - /data/vm/test-bigtangle-postgres/var/lib/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d info"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
 
  minio:
    image: minio/minio
    container_name: minio
    hostname: minio
    networks:
      - bigtangle-bridged-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      MINIO_DEFAULT_BUCKETS: testbigtangle
    volumes:
      -  /data/vm/minio/minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
