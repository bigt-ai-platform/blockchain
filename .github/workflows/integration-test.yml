name: Integration Tests with PostgreSQL

on:
  push:
    branches:
      - main
      - contract
      - develop
      - pos
  pull_request:
    branches:
      - main
      - develop
      - pos
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: info
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Local Kafka for the suite (same role as helper/kafka-local.sh locally:
      # every harness gets its own broker). Single listener is enough — CI
      # tests run on the host and reach it at localhost:9092. bitnami image
      # (not apache) because GH services cannot mount the server.properties
      # file the apache image needs for custom listeners.
      kafka:
        image: bitnami/kafka:3.7
        env:
          KAFKA_CFG_NODE_ID: 1
          KAFKA_CFG_PROCESS_ROLES: broker,controller
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
          ALLOW_PLAINTEXT_LISTENER: "yes"
        ports:
          - 9092:9092


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'



      - name: Run Maven integration tests
        run: mvn -B package  -Dsurefire.excludes=**/performance/**  --file pom.xml
        env:
          MAVEN_OPTS: -Xmx4g -Xms1g
          # Local broker (see kafka service above + helper/kafka-local.sh).
          # Streams stay OFF by default (server default); KAFKA_STREAMS=1 in a
          # manual dispatch opts the suite into streams-on.
          BOOT_STRAP_SERVERS: localhost:9092
