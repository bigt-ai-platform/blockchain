name: MCMC Single Docker Test

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  mcmc-single-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run single-container MCMC tests
        run: ./helper/docker-test-mcmc/run-parallel-tests.sh --single
