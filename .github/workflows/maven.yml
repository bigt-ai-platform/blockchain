# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven
on:
  push:
    branches:
      - main
      - ordermatch
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package  -DskipTests=true  --file pom.xml
    - name: Get current project version
      id: get_version
      run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Check if version exists on GitHub Packages
      id: version_check
      run: |
          VERSION=${{ steps.get_version.outputs.version }}
          PACKAGE_URL="https://maven.pkg.github.com/bigtangle/server/net/bigtangle/bigtangle/${VERSION}/bigtangle-${VERSION}.pom"
          echo "Checking $PACKAGE_URL"
          if curl --fail --silent --head -u ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} "$PACKAGE_URL"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

    - name: Stop if version already published
      if: steps.version_check.outputs.exists == 'true'
      run: echo "Version already published. Skipping deploy." && exit 0

    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy -s $GITHUB_WORKSPACE/.github/workflows/maven-settings.xml -DskipTests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
