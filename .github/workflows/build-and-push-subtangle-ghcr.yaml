name: build-and-push-subtangle-ghcr
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}

jobs:
  bigtangle-subtangle-container-ghcr:
    if: github.repository == 'bigt-ai-platform/blockchain'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Required to get full commit history for version detection

      # Extract version from pom.xml
      - name: Get Maven version
        id: maven-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Extracted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v1

      - name: Log into GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        if: ${{ vars.DOCKERHUB_REPOSITORY != '' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Get sanitized branch name
      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | tr -cd '[:alnum:]._-' | tr '[:upper:]' '[:lower:]' | cut -c1-128)
          echo "Original branch: $BRANCH_NAME"
          echo "Sanitized branch: $SANITIZED_BRANCH"
          echo "branch_name=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=raw,value=bigtangle-subtangle-${{ steps.branch.outputs.branch_name }}-${{ steps.maven-version.outputs.version }}
            type=raw,value=bigtangle-subtangle-${{ steps.branch.outputs.branch_name }}-latest
            type=sha,enable=true,priority=100,prefix=bigtangle-subtangle:,suffix=,format=long

      - name: Prepare Docker Hub tags
        id: dh-tags
        if: ${{ vars.DOCKERHUB_REPOSITORY != '' }}
        shell: bash
        run: |
          TAGS=$(cat <<EOF
          ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}:bigtangle-subtangle-${{ steps.branch.outputs.branch_name }}-${{ steps.maven-version.outputs.version }}
          ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}:bigtangle-subtangle-${{ steps.branch.outputs.branch_name }}-latest
          EOF
          )
          echo "tags<<TAGS_EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "TAGS_EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          file: ./helper/bigtangle-subtangle/Dockerfile
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.dh-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max